name: Auto-Update Financial Data
on:
  schedule:
    - cron: '0 6 * * 1-6'  # Runs at 14:00 SGT (UTC+8)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
# --- Every time a GitHub Action runs, GitHub spins up a brand-new, clean vm ---

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Clean working directory and Pull
        run: |
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run update script
        run: python data/update_data_silver.py

      - name: Run update script
        run: python data/update_data_gold.py

      - name: Commit and push changes
        run: |
          git config --global user.email "action@github.com"
          git pull --rebase origin main
          git add data/*.csv
          git commit -m "Automated data update: $(date)" || exit 0
          git push
