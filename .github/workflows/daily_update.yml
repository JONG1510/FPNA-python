name: Auto-Update Financial Data

on:
  schedule:
    - cron: '0 0 * * 1-6' # Runs at 08:00 SG 
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run update script
        run: python data/update_data_silver.py

      - name: Run update script
        run: python data/update_data_gold.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add data/*.csv
          git commit -m "Automated data update: $(date)" || exit 0

          # Pull latest changes to avoid "rejected" error
          git pull --rebase origin main
          
          git push
