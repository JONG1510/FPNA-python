name: Auto-Update Financial Data

on:
  schedule:
    - cron: '0 2 * * 1-6' # Runs at 00:00 UTC (10:00 SGT), Monday to Saturday
  workflow_dispatch: # Allows manual triggers

# CRITICAL: Grant permission to push changes back to the repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetches all history so rebase works cleanly if needed
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance pandas

      # Fixed duplicate names for better log readability
      - name: Run Silver Data Update
        run: python data/update_data_silver.py

      - name: Run Gold Data Update
        run: python data/update_data_gold.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add data/*.csv
          
          # Only commit if there are actual changes to avoid workflow errors
          if ! git diff --cached --quiet; then
            git commit -m "Automated data update: $(date)"
            git pull --rebase origin main
            git push
          else
            echo "No changes detected in data files. Skipping push."
          fi
