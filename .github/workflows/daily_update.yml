name: Auto-Update Financial Data
on:
  schedule:
    - cron: '0 1 * * 1-6'  # Runs at 9:00 SGT (UTC+8)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Update silver data
        run: python data/update_data_silver.py

      - name: Update gold data
        run: python data/update_data_gold.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git pull --rebase origin main
          git add data/*.csv
          git diff --cached --quiet || git commit -m "Automated data update: $(date)"
          git push
